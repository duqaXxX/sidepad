# Runs on every push to main and every pull request. Two jobs rather than one, and they stay
# separate: a leak is not a reason to stop reporting a broken test, nor the reverse, so a red check
# names what broke without anybody opening a log.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch only needs its latest commit checked; superseded runs are cancelled rather than queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Sensitive-data scan
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan diffs against a base commit, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The range is computed in the shell and the refs arrive through the environment, never
      # interpolated into the script: a branch name on a pull request from a fork is attacker-
      # controlled text, and `${{ }}` inside a `run:` block would paste it straight into bash.
      - name: Scan the pushed changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # Three dots: what this branch ADDS since it forked, not every change on the base since.
            git diff "origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff "$BEFORE..$SHA"
          else
            # First push of a branch, or a force-push whose old tip is gone: scan the tip commit.
            git show "$SHA"
          fi | bash .github/scripts/scan-sensitive-diff.sh

  check:
    name: Tests, types, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `bun-version`: the action reads `packageManager` from package.json, so the version CI
      # runs is the one a contributor installs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # `bun run test`, not `bun test`: the runner skips dot-directories when it scans for test
      # files, so a bare `bun test` silently leaves .github/scripts/ untested.
      - run: bun run test

      # Tests do not type-check, so a type error survives a green suite.
      - run: bun run typecheck

      # Formatting and lint in one pass. It reports rather than rewrites: a pipeline that edits the
      # code under review hides the difference between what an author wrote and what a machine changed.
      - run: bun run lint
