# Claude Code ships about a version a day, and sidepad is built on an API that changes between them
# without notice. This asks the one question a schedule can answer on its own: does the plugin still
# pass its tests on the version people are installing right now?
#
# One issue holds the answer. Its body is rewritten on every run, so it always shows the current
# state, and editing a body notifies nobody. A comment arrives only when there is something to do:
# the tests failed, or the release is more than a patch past the declarations this repository ships.
# Close the issue once you have looked at the release it names, and the next one opens a fresh issue.
name: Claude Code release watch

on:
  schedule:
    # Daily. The schedule event slips under load and can be dropped, so the run is idempotent: a
    # missed day is caught by the next one, since the state lives in the issue and not in a counter.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Read the version npm serves
        id: npm
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r .version)"
          [ -n "$latest" ] && [ "$latest" != "null" ] || { echo "npm did not name a version" >&2; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Run the plugin's tests against it
        id: tests
        env:
          LATEST: ${{ steps.npm.outputs.latest }}
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
        run: |
          set -uo pipefail
          npm install -g "@anthropic-ai/claude-code@$LATEST" >/dev/null 2>&1 || {
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"; exit 0; }
          if ! claude plugin test --help 2>/dev/null | grep -q '^Usage: claude plugin test'; then
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if claude plugin test plugins/sidepad && claude plugin validate plugins/sidepad --strict; then
            echo "outcome=pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the issue, or bring it up to date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LATEST: ${{ steps.npm.outputs.latest }}
          OUTCOME: ${{ steps.tests.outputs.outcome }}
        run: bash .github/scripts/watch-claude-code-release.sh

      - name: Fail the run when the tests failed
        if: steps.tests.outputs.outcome == 'fail'
        run: |
          echo "The plugin's tests fail on Claude Code ${{ steps.npm.outputs.latest }}." >&2
          exit 1
